[project]
name = "docs-studio-backend"
version = "0.1.0"
description = "Docs Studio API"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "pydantic>=2",
  "pydantic-settings",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg",
  "alembic",
  "uvicorn[standard]",
  "anthropic>=2.3.0",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "httpx",
  "ruff",
  "mypy",
  "pyyaml>=6.0.3",
  "types-pyyaml>=6.0.12.20261030",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# "src" makes `import app` work; "." makes `import tests.db_guard` work.
pythonpath = ["src", "."]
markers = [
  "db: needs the real PostgreSQL _test database (TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
